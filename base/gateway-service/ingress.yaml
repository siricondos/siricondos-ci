apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway-service
spec:
  ingressClassName: traefik
  rules:
    - host: placeholder.siricondos.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 80
