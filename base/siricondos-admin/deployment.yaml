apiVersion: apps/v1
kind: Deployment
metadata:
  name: siricondos-admin
spec:
  replicas: 2
  selector:
    matchLabels:
      app: siricondos-admin
  template:
    metadata:
      labels:
        app: siricondos-admin
    spec:
      containers:
        - name: siricondos-admin
          image: registry.siricondos.com/siricondos/siricondos-admin:v0.0.0
          envFrom:
            - configMapRef:
                name: shared-env-config
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
