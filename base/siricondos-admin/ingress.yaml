apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: siricondos-admin
spec:
  ingressClassName: traefik
  rules:
    - host: placeholder.siricondos.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: siricondos-admin
                port:
                  number: 80
