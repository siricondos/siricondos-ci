namespace: apps-prod

resources:
  - ../../../base/gateway-service

images:
  - name: registry.siricondos.com/siricondos/gateway-service
    newTag: v0.0.0

patches:
  - target:
      kind: Ingress
      name: gateway-service
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: api.siricondos.com

components:
  - ../../../components/backend-secrets
  - ../../../components/prod-small
